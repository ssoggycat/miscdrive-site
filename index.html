                  <path d="M160-240q-33 0-56-23t-24-57v-447l-53-53 57-57L876-85l-57 57-212-212zm720 45L755-320h45v-480H275l-80-80h605q33 0 57 24t23 56zM160-320h367l-80-80H240v-80h127l-40-40h-87v-80h7l-87-87zm515-80-80-80h125v80zM555-520l-80-80h245v80zM435-640l-80-80h365v80zm80 80"/>

              <div class="refreshwrap" title="cache age">
                <button type="button" class="refreshbutton" title="refetch files">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#aac1f0" viewBox="0 -960 960 960">
                    <path d="M480-160q-134 0-227-93t-93-227 93-227 227-93q69 0 132 29t108 81v-110h80v280H520v-80h168q-32-56-87-88t-121-32q-100 0-170 70t-70 170 70 170 170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67"/>

              </div>
              <div class="discordwrap">
                <button type="button" class="discordavatarbutton" title="account">
                  <svg class="discordavatar" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
                  <path fill="#ccd6dd" d="M-.7-.4h128.8V128H-.7z"/>

                </button>
                <div class="discordmenu" hidden>
                  <div class="discordmenutop">
                    <div class="discordmenuavatar"></div>
                    <div class="discordmenuname">not signed in</div>
                  </div>
                  <button type="button" class="discordmenulogout" hidden>
                    <svg height="24" viewBox="0 0 24 24" width="24" focusable="false">
                      <path fill="#e6e6e6" d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"></path>
                    </svg>
                    log out
                  </button>
                </div>
              </div>
            </div>
          </div>
        </header>
        <div class="loginhint" hidden>
          <img src="assets/images/login.png" alt="log in to comment">
        </div>

        <main class="drivecontent">
          <div class="drivegrid" role="main"></div>
        </main>

      </div>
    </div>

    <div class="medialightbox" hidden>
      <div class="mediabackdrop"></div>
      <div class="mediabox" role="dialog" aria-modal="true">
        <div class="mediatoolbar">
          <button type="button" class="mediaclose headericonbutton" title="close preview">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#e3e3e3" viewBox="0 -960 960 960">
              <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80z"/>
            </svg>
          </button>
          <button type="button" class="mediatoolbtn mediadownload headericonbutton" title="download">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#e3e3e3" viewBox="0 -960 960 960">
              <path d="M480-320 280-520l56-58 104 104v-326h80v326l104-104 56 58zM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160z"/>

          </button>
          <button type="button" class="mediatoolbtn mediacopylink headericonbutton" title="copy preview link">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#e3e3e3" viewBox="0 -960 960 960">
              <path d="M440-280H280q-83 0-141.5-58.5T80-480q0-83 58.5-141.5T280-680h160v80H280q-50 0-85 35t-35 85q0 50 35 85t85 35h160zM320-440v-80h320v80zm200 160v-80h160q50 0 85-35t35-85q0-50-35-85t-85-35H520v-80h160q83 0 141.5 58.5T880-480q0 83-58.5 141.5T680-280z"/>

            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#e3e3e3" viewBox="0 -960 960 960">
              <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120zm0-80h560v-560H200zm40-80h480L570-480 450-320l-90-120zm-40 80v-560z"/>
            </svg>
          </button>
          <button type="button" class="mediatoolbtn mediacommentbtn headericonbutton" title="add comment">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#e3e3e3" viewBox="0 -960 960 960">
              <path d="M440-400h80v-120h120v-80H520v-120h-80v120H320v80h120zM80-80v-720q0-33 23.5-56.5T160-880h640q33 0 56.5 23.5T880-800v480q0 33-23.5 56.5T800-240H240zm126-240h594v-480H160v525zm-46 0v-480z"/>
            </svg>
          </button>
        </div>
        <div class="mediaviewport">
          <div class="mediastage">
            <button type="button" class="medianav medianavleft headericonbutton" title="previous image" hidden>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#9aa0a6" viewBox="0 -960 960 960">
                <path d="M560-240 320-480l240-240 56 56-184 184 184 184z"/>
              </svg>
            </button>
            <button type="button" class="medianav medianavright headericonbutton" title="next image" hidden>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#9aa0a6" viewBox="0 -960 960 960">
                <path d="M504-480 320-664l56-56 240 240-240 240-56-56z"/>
              </svg>
            </button>
            <div class="mediacontent"></div>
            <div class="mediaregionlayer"></div>
            <div class="mediainfo" aria-live="polite"></div>
          </div>
          <aside class="mediacomments" hidden>
            <div class="mediacommentslist"></div>
          </aside>
        </div>
      </div>
    </div>

    <div class="zipwrap">
      <div class="zippanel" hidden>
        <div class="zipname"></div>
        <div class="zipbar"><div class="zipbarfill"></div></div>
        <div class="zipstats"></div>
      </div>
      <button type="button" class="zipbutton" title="download everything as zip">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="#aac1f0" viewBox="0 -960 960 960">
          <path d="m480-240 160-160-56-56-64 62v-166h-80v166l-64-62-56 56zM200-640v440h560v-440zm0 560q-33 0-56.5-23.5T120-160v-499q0-14 4.5-27t13.5-24l50-61q11-14 27.5-21.5T250-800h460q18 0 34.5 7.5T772-771l50 61q9 11 13.5 24t4.5 27v499q0 33-23.5 56.5T760-80zm16-640h528l-34-40H250zm264 300z"/>

      </button>
    </div>

    <script type="module" src="src/main.js"></script>

  </body>
